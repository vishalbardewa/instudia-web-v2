name: SEO & Metadata Quality Assurance

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  seo-validation:
    name: Validate SEO & Metadata Integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Metadata & Author Entity Validation
        run: npm run validate:meta

      - name: Run Next.js Build
        run: npm run build
